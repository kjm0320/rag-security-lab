[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-security-lab"
version = "0.1.0"
description = "A security testing platform for LLM and RAG applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
vector = [
    "fastembed==0.8.0",
    "onnxruntime==1.30.0",
]